<style>
    .grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 50vh;
        gap: 10px;
        padding: 10px;
        background: black;
        min-height: 100vh;
        margin: 0;
    }

    .iframe-wrapper {
        position: relative;
        transition: all 0.3s ease;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 12px;
    }

    /* Fullscreen mode */
    .fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        background: white;
        padding: 0;
    }

    .fullscreen iframe {
        border-radius: 0;
    }

    /* Exit button */
    .exit-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 10000;
        background: rgba(0,0,0,0.7);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 16px;
        display: none;
    }

    .exit-btn:hover {
        background: black;
    }
</style>

<div class="grid-container">
    <div class="iframe-wrapper" data-site="youtube">
        <iframe src="https://iqracademy.github.io/99names"></iframe>
    </div>
   
</div>

<button class="exit-btn" id="exitFullscreen">✖ Exit Fullscreen</button>

<script>
    const wrappers = document.querySelectorAll('.iframe-wrapper');
    const exitBtn = document.getElementById('exitFullscreen');

    wrappers.forEach(wrapper => {
        wrapper.addEventListener('click', (e) => {
            // Don't trigger if clicking inside iframe (prevents double-fullscreen)
            if (e.target === wrapper || e.target === wrapper.querySelector('iframe')) {
                document.querySelectorAll('.iframe-wrapper').forEach(w => {
                    w.classList.remove('fullscreen');
                });
                wrapper.classList.add('fullscreen');
                exitBtn.style.display = 'block';
            }
        });
    });

    exitBtn.addEventListener('click', () => {
        document.querySelectorAll('.iframe-wrapper').forEach(w => {
            w.classList.remove('fullscreen');
        });
        exitBtn.style.display = 'none';
    });

    // Escape key exits too
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.iframe-wrapper').forEach(w => {
                w.classList.remove('fullscreen');
            });
            exitBtn.style.display = 'none';
        }
    });
</script>
